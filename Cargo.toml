[package]
name = "protonctx"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Launch executables inside a Steam game's Proton context"
repository = "local"

# Opt into the workspace lints (clippy denies below).
[lints]
workspace = true

[dependencies]
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
steam-vdf-parser = "0.1"
cxx = "=1.0"
cxx-gen = "=0.7"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
# Must match [dependencies] cxx pin.
cxx = "=1.0"

# [profile.release]
# lto = true
# strip = true
# codegen-units = 1

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
