[package]
name = "protonctx"
version = "1.5.2"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "Launch executables inside a Steam game's Proton context"
repository = "https://github.com/l-raider/protonctx"

[dependencies]
# Slint on X11 (XWayland on Plasma) with the CPU software renderer (no GPU
# driver needed). X11 so dialogs can be transient children of the main window
# (see x11_dialog).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-x11",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
# The KDE reader (kdeglobals + portal) behind `SystemTheme::from_system`.
native-theme = { version = "0.6.1", default-features = false, features = ["linux"] }
# Dialog hints (WM_TRANSIENT_FOR, dialog type) on X11; pure Rust connection.
x11rb = "0.13"
# Slint has no public clipboard API; its winit backend uses arboard too.
arboard = { version = "3.6", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
# Timer for the launch-output batch window; already in the tree through ashpd.
async-io = "2"
# The file chooser portal, and the Settings portal's light/dark preference.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "settings"] }
url = "2"
steam-vdf-parser = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Must match `slint`: the generated code checks the runtime's version.
slint-build = "1.18"

[dev-dependencies]
# PNG output of the headless visual snapshots (src/visual_tests.rs).
png = "0.18"

# opt-level 2 had the lowest CPU under interaction of 1/2/3/s/z, at ~2 MB
# more memory and ~3 MB more binary than "s" (docs/benchmarks/opt-level.md).
[profile.publicrelease]
inherits = "release"
opt-level = 2
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[lints.rust]
# `deny` rather than `forbid`: Slint's generated UI code allows `unsafe_code`
# locally for its static vtables (see src/main.rs).
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# --- Debian packaging (cargo-deb) ---
# The binary is listed explicitly to ensure it is packed regardless of
# cargo-deb's auto-detection. `$auto` (dpkg-shlibdeps, needs a Debian/Ubuntu
# build host) finds glibc and fontconfig (linked by Slint's font lookup):
# winit and softbuffer dlopen() the X11 and xkbcommon libraries at runtime, so
# those are listed explicitly.
[package.metadata.deb]
name = "protonctx"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxrandr2, libxi6"
section = "utils"
priority = "optional"
maintainer = "protonctx maintainers"
extended-description = """\
Helper GUI tool to launch executables inside a Steam game's Proton context."""
assets = [
    ["target/release/protonctx", "usr/bin/protonctx", "755"],
    ["packaging/protonctx.desktop", "usr/share/applications/protonctx.desktop", "644"],
    ["packaging/icons/hicolor/16x16/apps/protonctx.png", "usr/share/icons/hicolor/16x16/apps/protonctx.png", "644"],
    ["packaging/icons/hicolor/24x24/apps/protonctx.png", "usr/share/icons/hicolor/24x24/apps/protonctx.png", "644"],
    ["packaging/icons/hicolor/32x32/apps/protonctx.png", "usr/share/icons/hicolor/32x32/apps/protonctx.png", "644"],
    ["packaging/icons/hicolor/48x48/apps/protonctx.png", "usr/share/icons/hicolor/48x48/apps/protonctx.png", "644"],
    ["packaging/icons/hicolor/64x64/apps/protonctx.png", "usr/share/icons/hicolor/64x64/apps/protonctx.png", "644"],
    ["packaging/icons/hicolor/128x128/apps/protonctx.png", "usr/share/icons/hicolor/128x128/apps/protonctx.png", "644"],
    ["packaging/icons/hicolor/256x256/apps/protonctx.png", "usr/share/icons/hicolor/256x256/apps/protonctx.png", "644"],
    ["packaging/icons/hicolor/scalable/apps/protonctx.svg", "usr/share/icons/hicolor/scalable/apps/protonctx.svg", "644"],
]

# --- RPM packaging (cargo-generate-rpm) ---
# Automatic requirements see only the linked libraries (glibc, fontconfig);
# the dlopen()'d display libraries are required explicitly (see the Debian
# note above).
[package.metadata.generate-rpm]
name = "protonctx"
release = "1"
summary = "Launch executables inside a Steam game's Proton context."
assets = [
    { source = "target/release/protonctx", dest = "/usr/bin/protonctx", mode = "755" },
    { source = "packaging/protonctx.desktop", dest = "/usr/share/applications/protonctx.desktop", mode = "644" },
    { source = "packaging/icons/hicolor/16x16/apps/protonctx.png", dest = "/usr/share/icons/hicolor/16x16/apps/protonctx.png", mode = "644" },
    { source = "packaging/icons/hicolor/24x24/apps/protonctx.png", dest = "/usr/share/icons/hicolor/24x24/apps/protonctx.png", mode = "644" },
    { source = "packaging/icons/hicolor/32x32/apps/protonctx.png", dest = "/usr/share/icons/hicolor/32x32/apps/protonctx.png", mode = "644" },
    { source = "packaging/icons/hicolor/48x48/apps/protonctx.png", dest = "/usr/share/icons/hicolor/48x48/apps/protonctx.png", mode = "644" },
    { source = "packaging/icons/hicolor/64x64/apps/protonctx.png", dest = "/usr/share/icons/hicolor/64x64/apps/protonctx.png", mode = "644" },
    { source = "packaging/icons/hicolor/128x128/apps/protonctx.png", dest = "/usr/share/icons/hicolor/128x128/apps/protonctx.png", mode = "644" },
    { source = "packaging/icons/hicolor/256x256/apps/protonctx.png", dest = "/usr/share/icons/hicolor/256x256/apps/protonctx.png", mode = "644" },
    { source = "packaging/icons/hicolor/scalable/apps/protonctx.svg", dest = "/usr/share/icons/hicolor/scalable/apps/protonctx.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libX11 = "*"
libX11-xcb = "*"
libxcb = "*"
libXcursor = "*"
libXrandr = "*"
libXi = "*"
