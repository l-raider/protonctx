[package]
name = "protonctx"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Launch executables inside a Steam game's Proton context"
repository = "https://github.com/lraider/protonctx"

[dependencies]
slint = { version = "1.17", default-features = false, features = ["std", "backend-qt", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steam-vdf-parser = "0.1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
slint-build = "1.17"

#[profile.release]
#lto = true
#strip = true
#codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
